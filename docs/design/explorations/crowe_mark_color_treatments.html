<!doctype html><meta charset="utf-8"><title>crowe_mark_color_treatments</title><style>:root{--text-primary:#1a1714;--text-secondary:#6b6457;--text-muted:#8a8274;--surface-0:#f7f3ea;--surface-1:#fbf8f1;--surface-2:#fffdf7;--border:rgba(26,23,20,.14);--border-strong:rgba(26,23,20,.25);--radius:8px;--font-sans:Inter,system-ui,sans-serif;--font-mono:ui-monospace,Menlo,monospace}body{background:var(--surface-0);margin:24px;font-family:var(--font-sans)}</style>
<h2 class="sr-only">Four intensified color treatments of the Crowe Logic thinking mark on dark surfaces, each with the blue arms flaring brighter at the bloom peak: signature, ember, electric, and regal.</h2>
<style>
.wrap{display:flex;flex-direction:column;gap:14px;padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.cell{background:#14120e;border:1px solid rgba(233,226,207,.14);border-radius:14px;padding:16px 8px 30px;display:flex;align-items:center;justify-content:center;position:relative;min-height:150px}
.tag{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:11px;color:#8f897a}
.mark{width:104px;height:104px;overflow:visible}
.rotor{transform-box:view-box;transform-origin:60px 60px}
.breath{transform-box:view-box;transform-origin:60px 60px}
.arm{transform-box:view-box;transform-origin:60px 60px}
.ping{transform-box:view-box;transform-origin:60px 60px;opacity:0}
.sig{--blue:#0054b2;--blueHot:#2f7fd6;--gold:#c9a227;--goldHot:#e0c15a;--ring:#c9a227}
.ember{--blue:#06337e;--blueHot:#2f78e0;--gold:#e8a52a;--goldHot:#ffc24d;--ring:#ffb347}
.electric{--blue:#1566d6;--blueHot:#5cc0ff;--gold:#f0c24a;--goldHot:#ffe08a;--ring:#7fd0ff}
.regal{--blue:#16276e;--blueHot:#4d6fd6;--gold:#d4af37;--goldHot:#f4de8f;--ring:#d4af37}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bReason{0%{transform:scale(.46)}42%{transform:scale(1.09)}66%{transform:scale(.82)}100%{transform:scale(.46)}}
@keyframes goldRecede{0%{opacity:.9}42%{opacity:.08}70%{opacity:.5}100%{opacity:.9}}
@keyframes armWob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.16)}}
@keyframes blueHeat{0%{stroke:var(--blue)}42%{stroke:var(--blueHot)}100%{stroke:var(--blue)}}
@keyframes coreHeat{0%{fill:var(--blue)}42%{fill:var(--blueHot)}100%{fill:var(--blue)}}
@keyframes toolPing{0%{transform:scale(.42);opacity:.95}100%{transform:scale(2.5);opacity:0}}
@keyframes corePop{0%,100%{transform:scale(1)}40%{transform:scale(1.55)}}
.cell{--sp:1.75s}
.cell .rotor{animation:spin 7.5s linear infinite}
.cell .breath{animation:bReason var(--sp) cubic-bezier(.37,0,.32,1) infinite}
.cell .gold-arm{animation:goldRecede var(--sp) cubic-bezier(.37,0,.32,1) infinite}
.cell .blue-arm{animation:armWob var(--sp) ease-in-out infinite,blueHeat var(--sp) cubic-bezier(.37,0,.32,1) infinite}
.cell .heart{animation:coreHeat var(--sp) cubic-bezier(.37,0,.32,1) infinite}
.cell.ping .ping{animation:toolPing .78s cubic-bezier(.16,1,.3,1)}
.cell.ping .core{animation:corePop .52s cubic-bezier(.16,1,.3,1)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls .sp{flex:1}
.note{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
@media(prefers-reduced-motion:reduce){.rotor,.breath,.arm,.blue-arm,.gold-arm,.heart{animation:none!important}.gold-arm{opacity:.55}}
</style>
<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button onclick="pulseAll()">Tool pulse</button>
    <button onclick="faster()">Faster</button>
    <button onclick="slower()">Slower</button>
    <span class="sp"></span>
    <span class="note">blue flares at the bloom · gold recedes to a clean star</span>
  </div>
</div>
<script>
(function(){
function arm(angle,r0,r1,w,which){
  var a=(angle-90)*Math.PI/180;
  var x1=(60+Math.cos(a)*r0).toFixed(2),y1=(60+Math.sin(a)*r0).toFixed(2);
  var x2=(60+Math.cos(a)*r1).toFixed(2),y2=(60+Math.sin(a)*r1).toFixed(2);
  var delay=(angle/360*-1.75).toFixed(2);
  var col=which==="blue"?"var(--blue)":"var(--gold)";
  var cls=which==="blue"?"arm blue-arm":"arm gold-arm";
  return '<line class="'+cls+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" style="animation-delay:'+delay+'s"/>';
}
function build(){
  var bA="",gA="",hex=[],ring=[],i,a;
  for(i=0;i<6;i++) bA+=arm(i*60,14,42,6,"blue");
  for(i=0;i<6;i++) gA+=arm(30+i*60,12,29,4.5,"gold");
  for(i=0;i<6;i++){a=(i*60-90)*Math.PI/180;hex.push((60+Math.cos(a)*13).toFixed(1)+","+(60+Math.sin(a)*13).toFixed(1));}
  for(i=0;i<6;i++){a=(i*60-90)*Math.PI/180;ring.push((60+Math.cos(a)*46).toFixed(1)+","+(60+Math.sin(a)*46).toFixed(1));}
  return '<svg class="mark" viewBox="0 0 120 120" aria-label="Crowe Logic mark">'
    +'<polygon class="ping" points="'+ring.join(" ")+'" fill="none" stroke="var(--ring)" stroke-width="2"/>'
    +'<g class="rotor"><g class="breath">'+gA+bA
    +'<g class="core"><polygon class="heart" points="'+hex.join(" ")+'" fill="var(--blue)"/>'
    +'<polygon points="'+hex.join(" ")+'" fill="none" stroke="var(--goldHot)" stroke-width="1.5"/>'
    +'<circle cx="60" cy="60" r="4.2" fill="var(--gold)"/></g>'
    +'</g></g></svg>';
}
var treatments=[["sig","signature"],["ember","ember"],["electric","electric"],["regal","regal"]];
var grid=document.getElementById("grid");
treatments.forEach(function(t){
  var cell=document.createElement("div");
  cell.className="cell "+t[0];
  cell.innerHTML=build()+'<div class="tag">'+t[1]+'</div>';
  grid.appendChild(cell);
});
var cells=Array.prototype.slice.call(document.querySelectorAll(".cell"));
window.pulseAll=function(){cells.forEach(function(c){c.classList.remove("ping");void c.offsetWidth;c.classList.add("ping");});};
var sp=1.75;
function setSp(){cells.forEach(function(c){c.style.setProperty("--sp",sp.toFixed(2)+"s");});}
window.faster=function(){sp=Math.max(.9,sp-.35);setSp();};
window.slower=function(){sp=Math.min(3,sp+.35);setSp();};
setInterval(pulseAll,4200);
})();
</script>
