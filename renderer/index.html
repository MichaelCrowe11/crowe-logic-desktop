<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
  <title>Crowe Logic</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="bar">
    <img id="avatar" src="../assets/avatar.png" alt="Crowe Logic" />
    <div class="lockup">
      <span class="crowe">Crowe</span><span class="logic">Logic</span>
    </div>
    <div class="spacer"></div>
    <span id="model-badge" class="badge">crowelm-zenith</span>
    <button id="settings-btn" class="ghost" title="Settings">Settings</button>
  </header>

  <main id="transcript">
    <div class="welcome">
      <img class="welcome-mark" src="../assets/mark.svg" alt="" />
      <h1>Crowe Logic</h1>
      <p>Agentic reasoning and coding over the CroweLM gateway. Frontier models,
         native tool calling, on Windows, Linux, and macOS.</p>
      <p class="hint">Set your token in Settings, then ask anything.</p>
    </div>
  </main>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Ask Crowe Logic..."></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <!-- Settings -->
  <div id="settings" class="modal hidden">
    <div class="modal-card">
      <h2>Settings</h2>
      <label>Gateway URL
        <input id="cfg-base" type="text" placeholder="https://..." />
      </label>
      <label>Model
        <input id="cfg-model" type="text" placeholder="crowelm-zenith" />
      </label>
      <label>Token (Crowe ID or API key)
        <input id="cfg-token" type="password" placeholder="paste to update; leave blank to keep" />
      </label>
      <div class="row">
        <button id="cfg-save" class="primary">Save</button>
        <button id="cfg-cancel" class="ghost">Cancel</button>
      </div>
      <p id="cfg-status" class="hint"></p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
