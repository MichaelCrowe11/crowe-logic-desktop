name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: windows
            paths: |
              release/*.exe
              release/latest.yml
          - os: ubuntu-latest
            command: npm run build:linux
            artifact: linux
            paths: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: macos-14
            command: npm run build:mac
            artifact: macos
            paths: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron 43 fetches its binary lazily, so materialise it before granting
      # chrome-sandbox the SUID bit it refuses to start without.
      - if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/smoke-shot.js
      # macOS artifacts are NOT published from CI. Notarization runs through the
      # `crowe-notary` keychain profile (build/notarize.js), which is a local
      # credential CI has no access to, so a runner can sign but cannot notarize
      # or staple. Building here still catches macOS packaging regressions; the
      # shipped dmg/zip are built, notarized and stapled on a release machine and
      # uploaded to the same release.
      - if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CROWE_SKIP_NOTARIZE: "1"
        run: ${{ matrix.command }}
      - if: runner.os != 'macOS'
        run: ${{ matrix.command }}
      # The macOS artifact is uploaded under a name the R2 publish job ignores,
      # so an unnotarized build can never reach the update channel.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'macOS' && 'macos-unsigned-do-not-ship' || matrix.artifact }}
          path: ${{ matrix.paths }}
      - if: startsWith(github.ref, 'refs/tags/') && runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.paths }}

  publish-r2:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Only the platforms CI can ship. macOS is published from a release
      # machine because notarization needs a local keychain profile.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{windows,linux}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish installers and updater metadata to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/publish-r2.sh artifacts
