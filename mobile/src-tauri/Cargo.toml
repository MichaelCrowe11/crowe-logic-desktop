[package]
name = "app"
version = "0.1.0"
description = "Crowe Logic mobile — Crowe Vision in the grow room"
authors = ["Michael Crowe"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# rustls rather than native-tls: native-tls wants an OpenSSL it cannot find when
# cross-compiling to aarch64-apple-ios, and rustls carries its own roots.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
