name: ci

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check preview.html is regenerated
        run: npm run preview:check

      # Electron ships chrome-sandbox unprivileged, and it refuses to start
      # rather than run unsandboxed. Grant it the SUID bit so the smoke suite
      # exercises the same sandboxing that shipped builds use.
      - name: Configure Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run smoke suite (headless via xvfb)
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a npx electron scripts/smoke-shot.js

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: /tmp/crowe-shots/
          if-no-files-found: ignore
