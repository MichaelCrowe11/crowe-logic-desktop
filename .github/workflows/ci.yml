name: ci

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # First, because it is the cheapest gate in the suite and the only one that
      # covers the agent loop itself: the tiers, the approval gate, the delivery
      # table, the cache, the ceilings, the verifier, the secret scanner. Pure
      # Node, so it needs neither Electron nor xvfb and fails in seconds.
      - name: Run harness tests
        run: node scripts/test-harness.js

      # Second, and for the same reason: pure Node, seconds to run, and it is
      # the only thing holding the mobile port to the desktop it copies. The
      # renderer ships to the phone verbatim, so a bridge method dropped here or
      # a routing rule added to the harness and not to mobile/src is a phone
      # that behaves differently with nothing in this suite noticing. Rebuilds
      # mobile/www on the way through, which also covers the www transforms.
      - name: Run mobile bridge tests
        run: node scripts/test-mobile-bridge.js

      # Same bargain as mobile, same cost, and this one is already serving real
      # traffic at /app. The renderer ships to the browser verbatim over
      # web-bridge.js, so a dropped method is a TypeError at a click in
      # production with no build step in between. Also holds the rule the bridge
      # states about itself, that it never puts a credential in browser storage.
      - name: Run web bridge tests
        run: |
          node scripts/build-rooms-web.js --check
          node scripts/test-web-bridge.js

      # Third, same reason again. Rooms is the one feature where a mistake costs
      # money per agent rather than once, so its rules - who is addressed, who
      # spends, who reviews whom, what the budget halts - are worth holding at
      # the cheapest gate available.
      - name: Run room engine tests
        run: node scripts/test-rooms.js

      # The build allowlist. package.json decides what reaches a packaged app,
      # and a directory added to the source tree and not to that list is a
      # crash at startup that every other suite here passes straight through:
      # they all run from the source tree, where the file is present.
      - name: Run packaging tests
        run: node scripts/test-packaging.js

      - name: Check preview.html is regenerated
        run: npm run preview:check

      # The vector half of the icon drift check. Pure string and Math work, so
      # it is byte-identical on every platform and belongs in this block; the
      # raster half needs the Electron binary and runs further down. Both are
      # needed: replaying the #44 failure showed the SVGs were all correct and
      # only the rasters were stale, so this step alone would have been green.
      - name: Check the brand vectors are regenerated
        run: node scripts/gen-mark.js --check

      # Electron 43 has no postinstall hook, so npm ci leaves dist/ empty and the
      # binary is fetched lazily on first launch. Fetch it up front, then grant
      # chrome-sandbox the SUID bit it requires: it refuses to start rather than
      # run unsandboxed. Keeping the sandbox on means CI exercises the same
      # posture as a shipped build.
      - name: Install Electron binary and configure its sandbox helper
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run smoke suite (headless via xvfb)
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a npx electron scripts/smoke-shot.js

      - name: Check palette contrast
        run: node scripts/check-contrast.js

      # The raster half. It re-renders every committed icon from the vectors and
      # compares, which is the only question staleness answers differently from
      # scripts/test-icons.js: that file asks whether the icon is the right kind
      # of picture, this one asks whether it is the current one. It compares
      # decoded pixels rather than bytes, so a PNG packed by a Mac and one packed
      # here are allowed to differ in bytes and not in image — which is what lets
      # this run on ubuntu at all.
      #
      # If this is the first red run after an Electron bump, that is the caret
      # range in package.json changing what Chromium's canvas draws, and
      # `npm run icons` plus a commit is the fix. If it is red for antialiasing
      # differences between llvmpipe here and Metal on a Mac, the fix is
      # app.disableHardwareAcceleration() in make-icons.js and one regeneration
      # commit, and failing that this step moves to a macOS runner.
      - name: Check the committed icons match the vectors (headless via xvfb)
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a npx electron scripts/make-icons.js --check

      - name: Run panel behaviour tests (headless via xvfb)
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a npx electron scripts/test-panels.js

      # The phone shell, in a phone-sized window. Electron rather than a browser
      # driver so the mobile app costs the suite no dependency the desktop one
      # was not already paying for, and because the layout only switches on
      # width: at test-panels' 1280 this would assert the desktop shell and pass.
      - name: Run mobile shell tests (headless via xvfb)
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a npx electron scripts/test-mobile-shell.js

      # The chain in one piece: renderer, preload, ipcMain, engine, harness. The
      # suites above each cut it somewhere - the engine one injects a fake
      # runner and never touches IPC, the panel one drives a shim and never
      # reaches main.js - so both can be green while nothing has called
      # crowe:rooms:say through a live handler. Needs the plaintext auth opt-in
      # because a runner has no keychain, which is the case that fallback was
      # written for.
      - name: Run rooms end-to-end tests (headless via xvfb)
        env:
          ELECTRON_ENABLE_LOGGING: "1"
          CROWE_ALLOW_PLAINTEXT_AUTH: "1"
        run: xvfb-run -a npx electron scripts/test-rooms-live.js

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: /tmp/crowe-shots/
          if-no-files-found: ignore
