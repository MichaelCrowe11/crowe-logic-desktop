name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: windows
            paths: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            command: npm run build:linux
            artifact: linux
            paths: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap
              release/latest-linux.yml
          - os: macos-14
            command: npm run build:mac
            artifact: macos
            paths: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron 43 fetches its binary lazily, so materialise it before granting
      # chrome-sandbox the SUID bit it refuses to start without.
      - if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/smoke-shot.js
      # macOS artifacts are NOT published from CI. Notarization runs through the
      # `crowe-notary` keychain profile (build/notarize.js), which is a local
      # credential CI has no access to, so a runner can sign but cannot notarize
      # or staple. Building here still catches macOS packaging regressions; the
      # shipped dmg/zip are built, notarized and stapled on a release machine and
      # uploaded to the same release.
      - if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CROWE_SKIP_NOTARIZE: "1"
        run: ${{ matrix.command }}
      # Windows Authenticode through Azure Trusted Signing. electron-builder reads
      # win.azureSignOptions from package.json and authenticates with the Entra
      # EnvironmentCredential below, a service principal holding "Artifact
      # Signing Certificate Profile Signer" on the crowelogicsigning account.
      # With the secrets unset, electron-builder fails the signing step rather
      # than shipping an unsigned installer, which is the behaviour we want on a
      # release tag. The certificate CN is the validated individual, so
      # SmartScreen shows the publisher as Michael Crowe until an organisation
      # validation is added to the account.
      - if: runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ${{ matrix.command }}
      # Prove the signature on the runner: an unsigned or untrusted installer
      # fails the job here instead of reaching the GitHub release.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer built" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host ("status: " + $sig.Status + " | signer: " + $sig.SignerCertificate.Subject + " | timestamp: " + $sig.TimeStamperCertificate.Subject)
          if ($sig.Status -ne "Valid") { throw ("installer signature is " + $sig.Status) }
      - if: runner.os == 'Linux'
        run: ${{ matrix.command }}
      # The macOS job is a packaging check: its build is unsigned and never
      # ships, so nothing of it is kept (17 such artifacts had grown to 7.8 GB
      # by 2026-09-17). The Windows and Linux installers live on the GitHub
      # release and on R2 once published; the artifact copies exist only for
      # the publish step on the release machine, which runs within hours, so
      # three days covers that and keeps the account's shared artifact storage
      # from filling (it hit the quota on 2026-09-16 with ninety days of release
      # builds). The release step below does not depend on the upload, so a
      # full quota cannot block a tag.
      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          retention-days: 3
      - if: startsWith(github.ref, 'refs/tags/') && runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.paths }}

  # There is deliberately no R2 publish job here. It cannot work from CI:
  #
  #   - macOS notarization runs through the `crowe-notary` keychain profile
  #     (build/notarize.js), a local credential a runner has no access to.
  #   - CLOUDFLARE_API_TOKEN has never had R2 write permission. The job it used
  #     to run failed every time with 403 Authentication error, which went
  #     unnoticed because this workflow had never been triggered.
  #
  # So the update channel and the download page are published from a release
  # machine, after the notarized macOS build, with:
  #
  #   npm run build:mac
  #   gh release download v<version> -D release -p '*'   # windows and linux
  #   GITHUB_REF_NAME=v<version> npm run publish:r2
  #
  # publish:r2 ends by running scripts/verify-release.js against the live feeds,
  # so a release that uploaded but did not resolve fails there rather than in
  # silence on a user's machine. The verify-release workflow runs the same check
  # daily and on demand.
  #
  # Grant an API token R2 write and this can move back into CI, but macOS would
  # still need App Store Connect API key auth in build/notarize.js.
