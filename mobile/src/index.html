<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so env(safe-area-inset-*) reports real numbers and the
       header clears the notch. Without it iOS letterboxes and the insets are 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Crowe Logic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img class="wordmark" src="brand/wordmark-dark.svg" alt="Crowe Logic">
    <!-- Drawn, not typed. A &#9881; renders as tofu here: the bundled Inter is a
         subset with no symbol block, and the webview does not fall through to a
         system face for it. -->
    <button class="gear" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main>
    <h1>Crowe Vision</h1>
    <p class="sub">Point the camera at substrate, a fruiting block, or a plate. Get contamination, stage, or species back.</p>

    <div class="types" id="types" role="group" aria-label="Analysis type">
      <button data-type="contamination" aria-pressed="true">Contamination</button>
      <button data-type="growth_stage" aria-pressed="false">Growth stage</button>
      <button data-type="species_id" aria-pressed="false">Species ID</button>
      <button data-type="general" aria-pressed="false">General</button>
    </div>

    <label class="shot" id="shot">
      <!-- No capture attribute on purpose. capture="environment" opens the rear
           camera immediately and offers nothing else - no library, no cancel-to-
           picker - which contradicts the hint below it and strands anyone
           checking a block they photographed an hour ago. Without it iOS puts up
           its own sheet with Take Photo and Photo Library, so both routes work. -->
      <input type="file" accept="image/*" id="file" aria-label="Take or choose a photo">
      <span class="shot-body">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2a1.5 1.5 0 0 0 1.28-.72l.84-1.4A1.5 1.5 0 0 1 10.1 4h3.8a1.5 1.5 0 0 1 1.28.88l.84 1.4A1.5 1.5 0 0 0 17.3 7h2.2A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>
          <circle cx="12" cy="13" r="3.6"/>
        </svg>
        <span class="label" id="shot-label">Take a photo</span>
        <span class="hint" id="shot-hint">or choose one from your library</span>
      </span>
    </label>

    <div class="actions">
      <button class="primary" id="analyze" disabled>Analyze</button>
      <button class="ghost" id="clear" disabled>Clear</button>
    </div>

    <div id="result"></div>
  </main>

  <dialog id="settings">
    <form method="dialog" class="sheet">
      <h2>Vision backend</h2>
      <p class="sub">Where the image is sent. Nothing leaves the phone until you press Analyze.</p>

      <label for="endpoint">Endpoint URL</label>
      <input type="text" id="endpoint" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">

      <label for="apikey">API key <span style="opacity:.7">(optional)</span></label>
      <input type="password" id="apikey" autocapitalize="off" autocorrect="off" spellcheck="false">

      <div class="actions">
        <button class="primary" value="save" id="save-settings">Save</button>
        <button class="ghost" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
